<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"><title>營運戰情室 - TalYah OMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex h-screen overflow-hidden">
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex border-r border-slate-800">
        <div>
            <div class="p-6 border-b border-slate-800"><span class="text-xl font-bold text-white">TalYah OMS</span></div>
            <nav class="p-4 space-y-1">
                <a href="/dashboard" class="flex items-center px-4 py-3 rounded-lg bg-blue-600 text-white text-sm font-medium">營運戰情室</a>
                <a href="/orders" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 text-sm font-medium">訂單與生命週期</a>
                <a href="/inventory" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 text-sm font-medium">庫存水位與商品</a>
                <a href="/customers" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 text-sm font-medium">客戶主檔與信用</a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-800"><a href="/logout" class="block w-full text-center bg-red-600/10 text-red-400 py-2 rounded-lg text-sm">安全登出</a></div>
    </aside>
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="bg-white border-b h-16 flex items-center justify-between px-8 shadow-sm">
            <h1 class="text-lg font-bold text-slate-800">企業級營運戰情室 (BI Dashboard)</h1>
            <span class="text-sm font-medium text-slate-600">使用者: <b>{{ user }}</b> (角色: <span class="text-blue-600 font-bold">{{ role }}</span>)</span>
        </header>
        <main class="flex-1 overflow-y-auto p-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border">
                    <p class="text-xs font-bold text-slate-400 uppercase">總營業額</p>
                    <p id="bi-rev" class="text-2xl font-bold text-emerald-600 mt-2">$-</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border">
                    <p class="text-xs font-bold text-slate-400 uppercase">客戶總數</p>
                    <p id="bi-cust" class="text-2xl font-bold text-slate-900 mt-2">-</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border">
                    <p class="text-xs font-bold text-slate-400 uppercase">上架商品</p>
                    <p id="bi-prod" class="text-2xl font-bold text-slate-900 mt-2">-</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border">
                    <p class="text-xs font-bold text-slate-400 uppercase">待確認草稿</p>
                    <p id="bi-draft" class="text-2xl font-bold text-amber-600 mt-2">-</p>
                </div>
            </div>
        </main>
    </div>
    <script>
        fetch('/api/bi/stats').then(res => res.json()).then(data => {
            document.getElementById('bi-rev').innerText = '$' + data.revenue.toLocaleString();
            document.getElementById('bi-cust').innerText = data.customers_count;
            document.getElementById('bi-prod').innerText = data.products_count;
            document.getElementById('bi-draft').innerText = data.pending_orders;
        });
    </script>
</body>
</html>
