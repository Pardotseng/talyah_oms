<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"><title>客戶主檔管理 - TalYah OMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex h-screen overflow-hidden">
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex border-r border-slate-800">
        <div>
            <div class="p-6 border-b border-slate-800"><span class="text-xl font-bold text-white">TalYah OMS</span></div>
            <nav class="p-4 space-y-1">
                <a href="/dashboard" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 text-sm font-medium">營運戰情室</a>
                <a href="/orders" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 text-sm font-medium">訂單與生命週期</a>
                <a href="/inventory" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 text-sm font-medium">庫存水位與商品</a>
                <a href="/customers" class="flex items-center px-4 py-3 rounded-lg bg-blue-600 text-white text-sm font-medium">客戶主檔與信用</a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-800"><a href="/logout" class="block w-full text-center bg-red-600/10 text-red-400 py-2 rounded-lg text-sm">安全登出</a></div>
    </aside>
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="bg-white border-b h-16 flex items-center justify-between px-8 shadow-sm">
            <h1 class="text-lg font-bold text-slate-800">客戶主檔與信用額度管理</h1>
            <span class="text-sm font-medium text-slate-600">使用者: <b>{{ user }}</b></span>
        </header>
        <main class="flex-1 overflow-y-auto p-8">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border h-fit">
                    <h2 class="text-md font-bold text-slate-800 mb-4 pb-2 border-b">新增客戶</h2>
                    <form id="cust-form" class="space-y-4">
                        <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">客戶名稱 *</label><input type="text" id="c-name" class="w-full border p-2 rounded-lg text-sm" required></div>
                        <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">統一編號 *</label><input type="text" id="c-tax" class="w-full border p-2 rounded-lg text-sm" required></div>
                        <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">客戶簡碼</label><input type="text" id="c-code" class="w-full border p-2 rounded-lg text-sm" placeholder="例: MWZX"></div>
                        <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">信用額度 (預設 500,000)</label><input type="number" id="c-credit" value="500000" class="w-full border p-2 rounded-lg text-sm"></div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg text-sm font-medium transition">儲存客戶</button>
                    </form>
                    <p id="c-msg" class="mt-3 text-sm font-medium text-center"></p>
                </div>
                <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border overflow-hidden">
                    <div class="p-6 border-b"><h2 class="text-md font-bold text-slate-800">客戶與 AR 應收帳款一覽</h2></div>
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 text-xs uppercase border-b">
                                <th class="p-4">簡碼</th><th class="p-4">名稱</th><th class="p-4">統編</th><th class="p-4">信用額度</th><th class="p-4">未結清帳款(AR)</th>
                            </tr>
                        </thead>
                        <tbody id="cust-tbody" class="text-sm divide-y"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script>
        async function loadCustomers() {
            const res = await fetch('/api/customers');
            const data = await res.json();
            document.getElementById('cust-tbody').innerHTML = data.map(c => `
                <tr class="hover:bg-slate-50">
                    <td class="p-4 font-mono font-bold text-blue-600">${c.customer_code || '-'}</td>
                    <td class="p-4 font-semibold">${c.name}</td>
                    <td class="p-4 font-mono">${c.tax_id}</td>
                    <td class="p-4">$${c.credit_limit.toLocaleString()}</td>
                    <td class="p-4 text-amber-600 font-bold">$${c.current_balance.toLocaleString()}</td>
                </tr>
            `).join('') || `<tr><td colspan="5" class="p-8 text-center text-slate-400">尚無客戶</td></tr>`;
        }
        document.getElementById('cust-form').onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch('/api/customers', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: document.getElementById('c-name').value,
                    tax_id: document.getElementById('c-tax').value,
                    customer_code: document.getElementById('c-code').value,
                    credit_limit: document.getElementById('c-credit').value
                })
            });
            const data = await res.json();
            const msg = document.getElementById('c-msg');
            if(res.ok) {
                msg.innerText = "✅ " + data.message; msg.className = "mt-3 text-sm font-medium text-center text-emerald-600";
                document.getElementById('cust-form').reset(); loadCustomers();
            } else {
                msg.innerText = "❌ " + data.error; msg.className = "mt-3 text-sm font-medium text-center text-red-600";
            }
        };
        loadCustomers();
    </script>
</body>
</html>
