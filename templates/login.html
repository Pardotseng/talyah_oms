<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"><title>登入 - TalYah OMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white tracking-wide">TalYah OMS</h1>
            <p class="text-slate-400 text-sm mt-1">企業級內部營運管理系統</p>
        </div>
        {% if error %}
        <div class="bg-red-500/10 border border-red-500 text-red-400 text-sm p-3 rounded-lg mb-4 text-center">{{ error }}</div>
        {% endif %}
        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">使用者帳號</label>
                <input type="text" name="username" class="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-lg text-sm focus:outline-none focus:border-blue-500" placeholder="admin" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">密碼</label>
                <input type="password" name="password" class="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-lg text-sm focus:outline-none focus:border-blue-500" placeholder="admin123" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-lg font-medium transition shadow-lg shadow-blue-600/30">安全登入系統</button>
        </form>
    </div>
</body>
</html>
