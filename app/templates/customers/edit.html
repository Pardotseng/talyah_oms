<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>編輯客戶 - TalYah OMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">🏢 編輯客戶：{{ customer.code }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">公司名稱：</label>
                        <input type="text" name="name" class="form-control" value="{{ customer.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">統一編號：</label>
                        <input type="text" name="tax_id" class="form-control" value="{{ customer.tax_id or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">電話：</label>
                        <input type="text" name="phone" class="form-control" value="{{ customer.phone or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">地址：</label>
                        <input type="text" name="address" class="form-control" value="{{ customer.address or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">客戶等級：</label>
                        <select name="customer_level_id" class="form-select">
                            <option value="">-- 請選擇等級 --</option>
                            {% for level in levels %}
                                <option value="{{ level.id }}" {% if customer.customer_level_id == level.id %}selected{% endif %}>{{ level.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('customer_bp.customer_list') }}" class="btn btn-outline-secondary">返回列表</a>
                        <button type="submit" class="btn btn-primary">儲存變更</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
