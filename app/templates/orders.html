<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"><title>訂單生命週期中心 - TalYah OMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex h-screen overflow-hidden">
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex border-r border-slate-800">
        <div>
            <div class="p-6 border-b border-slate-800"><span class="text-xl font-bold text-white">TalYah OMS</span></div>
            <nav class="p-4 space-y-1">
                <a href="/dashboard" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 text-sm font-medium">營運戰情室</a>
                <a href="/orders" class="flex items-center px-4 py-3 rounded-lg bg-blue-600 text-white text-sm font-medium">訂單與生命週期</a>
                <a href="/inventory" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 text-sm font-medium">庫存水位與商品</a>
                <a href="/customers" class="flex items-center px-4 py-3 rounded-lg hover:bg-slate-800 text-sm font-medium">客戶主檔與信用</a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-800"><a href="/logout" class="block w-full text-center bg-red-600/10 text-red-400 py-2 rounded-lg text-sm">安全登出</a></div>
    </aside>
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="bg-white border-b h-16 flex items-center justify-between px-8 shadow-sm">
            <h1 class="text-lg font-bold text-slate-800">訂單生命週期狀態機控制中心</h1>
            <span class="text-sm font-medium text-slate-600">使用者: <b>{{ user }}</b></span>
        </header>
        <main class="flex-1 overflow-y-auto p-8">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border h-fit">
                    <h2 class="text-md font-bold text-slate-800 mb-4 pb-2 border-b">開立新訂單</h2>
                    <form id="order-form" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">選擇客戶</label>
                            <select id="order-cust" class="w-full border p-2 rounded-lg text-sm" required></select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">選擇商品 SKU</label>
                            <select id="order-prod" class="w-full border p-2 rounded-lg text-sm" required></select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">數量</label>
                                <input type="number" id="order-qty" value="1" min="1" class="w-full border p-2 rounded-lg text-sm" required>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">運輸模式</label>
                                <select id="order-mode" class="w-full border p-2 rounded-lg text-sm">
                                    <option value="air">空運價</option>
                                    <option value="sea">海運價</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white py-2 rounded-lg text-sm font-medium transition">確認開立訂單</button>
                    </form>
                    <p id="order-msg" class="mt-3 text-sm font-bold text-center"></p>
                </div>
                <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border overflow-hidden">
                    <div class="p-6 border-b"><h2 class="text-md font-bold text-slate-800">歷史訂單與狀態機控制</h2></div>
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 text-xs uppercase border-b">
                                <th class="p-4">單號</th><th class="p-4">客戶</th><th class="p-4">金額</th><th class="p-4">狀態</th><th class="p-4">狀態機動作</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody" class="text-sm divide-y"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script>
        async function loadData() {
            const custRes = await fetch('/api/customers');
            const customers = await custRes.json();
            document.getElementById('order-cust').innerHTML = customers.map(c => `<option value="${c.id}">${c.name} (${c.tax_id})</option>`).join('');

            const prodRes = await fetch('/api/inventory');
            const products = await prodRes.json();
            document.getElementById('order-prod').innerHTML = products.map(p => `<option value="${p.id}">${p.sku_code} - ${p.description}</option>`).join('');

            const ordRes = await fetch('/api/orders');
            const orders = await ordRes.json();
            document.getElementById('orders-tbody').innerHTML = orders.map(o => `
                <tr class="hover:bg-slate-50">
                    <td class="p-4 font-mono font-bold text-blue-600">${o.order_number}</td>
                    <td class="p-4">${o.customer_name}</td>
                    <td class="p-4 text-emerald-600 font-bold">$${o.total_amount}</td>
                    <td class="p-4"><span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-xs font-bold">${o.status}</span></td>
                    <td class="p-4 space-x-1">
                        <button onclick="changeStatus('${o.id}', 'Confirmed')" class="bg-blue-50 text-blue-600 px-2 py-1 rounded text-xs font-bold hover:bg-blue-100">確認(扣庫存/AR)</button>
                        <button onclick="changeStatus('${o.id}', 'Cancelled')" class="bg-red-50 text-red-600 px-2 py-1 rounded text-xs font-bold hover:bg-red-100">取消</button>
                    </td>
                </tr>
            `).join('') || `<tr><td colspan="5" class="p-8 text-center text-slate-400">尚無訂單紀錄</td></tr>`;
        }

        document.getElementById('order-form').onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch('/api/orders', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    customer_id: document.getElementById('order-cust').value,
                    items: [{
                        product_id: document.getElementById('order-prod').value,
                        quantity: parseInt(document.getElementById('order-qty').value),
                        air_or_sea: document.getElementById('order-mode').value
                    }]
                })
            });
            const data = await res.json();
            const msg = document.getElementById('order-msg');
            if(res.ok) {
                msg.innerText = `✅ ${data.message} (${data.order_number})`;
                msg.className = "mt-3 text-sm font-bold text-center text-emerald-600";
                loadData();
            } else {
                msg.innerText = `❌ ${data.error}`;
                msg.className = "mt-3 text-sm font-bold text-center text-red-600";
            }
        };

        async function changeStatus(id, status) {
            const res = await fetch('/api/orders/status', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({order_id: id, status: status})
            });
            const data = await res.json();
            if(res.ok) { alert(data.message); loadData(); }
            else { alert('操作失敗: ' + data.error); }
        }

        loadData();
    </script>
</body>
</html>
