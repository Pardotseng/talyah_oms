<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>編輯產品 - TalYah OMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">🏷️ 編輯產品 SKU：{{ sku.sku_code }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">商品描述：</label>
                        <input type="text" name="description" class="form-control" value="{{ sku.description }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">單位：</label>
                        <input type="text" name="unit" class="form-control" value="{{ sku.unit }}" required>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">標準定價：</label>
                            <input type="number" step="0.01" name="original_price" class="form-control" value="{{ sku.original_price }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">空運價：</label>
                            <input type="number" step="0.01" name="air_price" class="form-control" value="{{ sku.air_price }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">海運價：</label>
                            <input type="number" step="0.01" name="sea_price" class="form-control" value="{{ sku.sea_price }}" required>
                        </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if sku.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">啟用此產品 (允許加入訂單)</label>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('product_bp.product_list') }}" class="btn btn-outline-secondary">返回列表</a>
                        <button type="submit" class="btn btn-primary">儲存變更</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
