<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}TalYah OMS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- 🌟 共用頂端導覽列（全站通用） -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('order_bp.order_list') }}">TalYah OMS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto">
                    <a class="nav-link {% if request.endpoint and 'order' in request.endpoint %}active fw-bold text-warning{% endif %}" href="{{ url_for('order_bp.order_list') }}">📦 訂單管理</a>
                    <a class="nav-link {% if request.endpoint and 'customer' in request.endpoint %}active fw-bold text-warning{% endif %}" href="{{ url_for('customer_bp.customer_list') }}">🏢 客戶管理</a>
                    <a class="nav-link {% if request.endpoint and 'product' in request.endpoint %}active fw-bold text-warning{% endif %}" href="{{ url_for('product_bp.product_list') }}">🏷️ 產品/SKU 管理</a>
                </div>
                <span class="navbar-text me-3 text-light">👤 {{ session.get('username', '訪客') }}</span>
                <a href="{{ url_for('auth_bp.logout') }}" class="btn btn-outline-light btn-sm">安全登出</a>
            </div>
        </div>
    </nav>

    <!-- 全域 Flash 閃現訊息 -->
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <!-- 每個頁面各自的內容會被填入這個區塊 -->
    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
