<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>登入 - TalYah OMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow-sm p-4" style="width: 400px;">
        <div class="text-center mb-4">
            <h3>🔐 TalYah OMS 登入</h3>
            <p class="text-muted">請輸入您的帳號密碼以繼續操作</p>
        </div>

        <!-- 訊息提示 -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">使用者帳號：</label>
                <input type="text" name="username" id="username" class="form-control" required placeholder="預設帳號: admin">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密碼：</label>
                <input type="password" name="password" id="password" class="form-control" required placeholder="預設密碼: admin123">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">登入系統</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
