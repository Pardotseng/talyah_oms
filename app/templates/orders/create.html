<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>建立新訂單 - TalYah OMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">📝 建立新訂單（步驟 1：選擇客戶）</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="customer_code" class="form-label">選擇客戶：</label>
                        <select name="customer_code" id="customer_code" class="form-select" required>
                            <option value="">-- 請選擇客戶 --</option>
                            {% for customer in customers %}
                                <option value="{{ customer.code }}">{{ customer.code }} - {{ customer.name }} (等級: {{ customer.level.name if customer.level else '無' }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('order_bp.order_list') }}" class="btn btn-outline-secondary">返回列表</a>
                        <button type="submit" class="btn btn-primary">下一步：建立草稿並指派編號</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
